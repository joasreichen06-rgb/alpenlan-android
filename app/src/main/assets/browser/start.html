<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpenlan Browser</title>
<style>
  :root {
    --bg: #070b12; --sky: #0b1630; --card: #101a2a; --line: #1c2a40;
    --fg: #eef2f7; --muted: #8a96a8; --blue: #4da3ff; --ink: #04101f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", "Roboto", system-ui, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  /* Nachthimmel mit Sternen */
  .sky {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1px 1px at 12% 18%, #fff9 50%, transparent 51%),
      radial-gradient(1px 1px at 27% 8%, #fff7 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 41% 22%, #fffc 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 12%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 71% 27%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 84% 9%, #fffb 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 33%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 38%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 41%, #fff5 50%, transparent 51%),
      radial-gradient(1px 1px at 64% 44%, #fff5 50%, transparent 51%),
      radial-gradient(120% 70% at 50% 0%, var(--sky) 0%, var(--bg) 70%);
  }
  .mountains { position: fixed; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; }
  .mountains svg { display: block; width: 100%; height: auto; }

  main {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: 12vh 16px 40vh;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand small {
    display: block; color: var(--blue); font-size: 12px; font-weight: 700;
    letter-spacing: .28em; margin-bottom: 6px;
  }
  .brand h1 {
    margin: 0; font-size: 38px; line-height: 1; font-weight: 800;
    letter-spacing: -.02em;
  }
  form {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 26px; padding: 6px 6px 6px 18px;
    box-shadow: 0 10px 40px #0008;
  }
  form:focus-within { border-color: var(--blue); }
  input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    color: var(--fg); font-size: 17px; padding: 12px 0;
  }
  input::placeholder { color: var(--muted); }
  button {
    border: 0; border-radius: 20px; background: var(--blue); color: var(--ink);
    font-weight: 700; font-size: 15px; padding: 12px 18px;
  }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  .chip {
    font-size: 12.5px; color: var(--muted); border: 1px solid var(--line);
    background: #0b1220cc; border-radius: 999px; padding: 6px 11px;
  }
  .chip b { color: var(--fg); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: #3ddc97; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 8px #3ddc97; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 34px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-decoration: none; color: var(--fg); font-size: 12px; text-align: center;
  }
  .tile span {
    width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line);
    font-weight: 800; font-size: 18px; color: var(--blue);
  }
  footer {
    position: fixed; left: 0; right: 0; bottom: 10px; z-index: 1;
    text-align: center; font-size: 11.5px; color: #8a96a8aa;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="mountains" aria-hidden="true">
    <svg viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice">
      <path d="M0 140 L0 92 L38 64 L62 80 L104 38 L132 66 L160 50 L206 96 L240 70 L276 22 L312 64 L340 52 L372 78 L400 66 L400 140 Z" fill="#0d1a2e"/>
      <path d="M276 22 L262 40 L270 38 L278 46 L286 38 L294 44 Z M104 38 L94 50 L102 48 L108 54 L116 49 Z" fill="#c9dcf2" opacity=".85"/>
      <path d="M0 140 L0 112 L46 90 L88 108 L136 80 L184 106 L226 88 L268 110 L316 86 L358 104 L400 92 L400 140 Z" fill="#09121f"/>
    </svg>
  </div>

  <main>
    <div class="brand">
      <small>ALPENLAN</small>
      <h1>BROWSER</h1>
    </div>

    <form id="f" autocomplete="off">
      <input id="q" type="search" placeholder="Sicher suchen …" enterkeyhint="search" autocapitalize="off">
      <button type="submit">Suchen</button>
    </form>

    <div class="chips">
      <div class="chip"><span class="dot"></span>Filter aktiv</div>
      <div class="chip">SafeSearch: <b>{{ENGINE}}</b></div>
      <div class="chip"><b>{{DOMAINS}}</b> Seiten · <b>{{WORDS}}</b> Wörter gesperrt</div>
      <div class="chip">wirkt auch mit VPN</div>
    </div>

    <nav class="tiles">
      <a class="tile" href="alpenlan://go?url=https%3A%2F%2Falpenlan.com"><span>A</span>Alpenlan</a>
      <a class="tile" href="alpenlan://go?url=https%3A%2F%2Fwww.srf.ch%2Fnews"><span>SRF</span>News</a>
      <a class="tile" href="alpenlan://go?url=https%3A%2F%2Fwww.meteoschweiz.admin.ch"><span>☀</span>Wetter</a>
      <a class="tile" href="alpenlan://go?url=https%3A%2F%2Fde.wikipedia.org"><span>W</span>Wikipedia</a>
    </nav>
  </main>

  <footer>Version {{VERSION}} · <a href="alpenlan://settings">Filter-Einstellungen 🔒</a></footer>

<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (v) location.href = 'alpenlan://search?q=' + encodeURIComponent(v);
  });
</script>
</body>
</html>
