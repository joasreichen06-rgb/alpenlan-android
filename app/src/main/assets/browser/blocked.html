<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gesperrt · Alpenlan</title>
<style>
  :root { --bg: #070b12; --sky: #0b1630; --card: #101a2a; --line: #1c2a40;
          --fg: #eef2f7; --muted: #8a96a8; --blue: #4da3ff; --ink: #04101f; --red: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px 30vh;
    color: var(--fg); font-family: "Inter", "Roboto", system-ui, sans-serif;
    background: radial-gradient(120% 70% at 50% 0%, var(--sky) 0%, var(--bg) 70%);
  }
  .mountains { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .mountains svg { display: block; width: 100%; height: auto; }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 420px; text-align: center;
    background: #101a2ae6; border: 1px solid var(--line); border-radius: 24px;
    padding: 30px 22px 22px; box-shadow: 0 16px 60px #000a;
  }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px;
    display: grid; place-items: center; background: #ff6b6b1a; border: 1px solid #ff6b6b55;
  }
  small { display: block; color: var(--blue); font-weight: 700; font-size: 12px; letter-spacing: .24em; }
  h1 { margin: 6px 0 10px; font-size: 28px; letter-spacing: -.01em; }
  p { margin: 0 0 6px; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .reason { color: var(--fg); font-weight: 600; margin: 14px 0 4px; }
  .host { font-size: 13px; color: var(--muted); word-break: break-all; }
  .buttons { display: grid; gap: 10px; margin-top: 22px; }
  a.btn {
    display: block; text-decoration: none; border-radius: 14px; padding: 14px;
    font-weight: 700; font-size: 16px;
  }
  .primary { background: var(--blue); color: var(--ink); }
  .ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
</style>
</head>
<body>
  <div class="mountains" aria-hidden="true">
    <svg viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice">
      <path d="M0 140 L0 92 L38 64 L62 80 L104 38 L132 66 L160 50 L206 96 L240 70 L276 22 L312 64 L340 52 L372 78 L400 66 L400 140 Z" fill="#0d1a2e"/>
      <path d="M0 140 L0 112 L46 90 L88 108 L136 80 L184 106 L226 88 L268 110 L316 86 L358 104 L400 92 L400 140 Z" fill="#09121f"/>
    </svg>
  </div>
  <div class="card">
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
      </svg>
    </div>
    <small>ALPENLAN BROWSER</small>
    <h1>Gesperrt</h1>
    <p>Diese Seite ist durch deinen Filter gesperrt.</p>
    <p class="reason">{{REASON}}</p>
    <p class="host">{{HOST}}</p>
    <div class="buttons">
      <a class="btn primary" href="alpenlan://back">Zurück</a>
      <a class="btn ghost" href="alpenlan://start">Startseite</a>
    </div>
  </div>
</body>
</html>
