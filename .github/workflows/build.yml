name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < version.txt)
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # Neues Release nur, wenn es die Version in version.txt noch nicht gibt
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "DO_RELEASE=1" >> "$GITHUB_ENV"
          fi

      - name: Signaturschlüssel
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein KEYSTORE_B64-Secret – APK wird nur mit Debug-Schlüssel signiert (Updates nicht möglich)."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "alpenlan-kalender-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: alpenlan-kalender-${{ env.VERSION_NAME }}
          path: alpenlan-kalender-*.apk

      - name: Release (für Obtainium)
        if: env.DO_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Alpenlan Kalender ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: alpenlan-kalender-*.apk
          generate_release_notes: true
